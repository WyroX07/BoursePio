<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/icon-192.png">

<body>
<header id="hdr"></header>
<main id="main"></main>
<nav id="nav"></nav>

<script src="vendor/qrcode.js"></script>
<script src="vendor/mqtt.min.js"></script>
<script src="js/data.js"></script>
<script src="js/common.js"></script>
<script src="js/sync.js"></script>
<script src="js/engine.js"></script>
<script src="js/host.js"></script>
<script src="js/screens.js"></script>
<script>
  // ?room=XXXX → écran spectateur (tel) · ?room=XXXX&tv=1 → grand écran · sinon → la banque
  if (new URLSearchParams(location.search).has('room')) screensInit(); else hostInit();
  if ('serviceWorker' in navigator && location.hostname.endsWith('github.io')) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
